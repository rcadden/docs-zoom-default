<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Docs Zoom Default</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 20px; min-width: 280px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; opacity: 0.7; font-size: 13px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  select { width: 100%; padding: 6px 8px; font-size: 14px; }
  #status { margin-top: 12px; min-height: 18px; font-size: 13px; color: #1a7f37; }
  @media (prefers-color-scheme: dark) { #status { color: #4ac26b; } }
</style>
</head>
<body>
  <h1>Default zoom for Google Docs</h1>
  <p class="hint">Applied automatically each time you open a document.</p>

  <label for="zoom">Zoom level</label>
  <select id="zoom">
    <option>Fit</option>
    <option>50%</option>
    <option>75%</option>
    <option>90%</option>
    <option>100%</option>
    <option>125%</option>
    <option>150%</option>
    <option>200%</option>
  </select>

  <div id="status" role="status"></div>

  <script src="options.js"></script>
</body>
</html>
